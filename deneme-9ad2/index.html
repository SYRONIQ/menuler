<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>DENEME — Menü</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--ust:#000000;--ust-yazi:#a51d34;--yazi:#ffffff;--soluk:#ffffff;
--vurgu:#a51d34;--fiyat:#ffffff;--cizgi:#2e2e2e;--sekme:#161616}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Lato,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--yazi)}
header{text-align:center;padding:30px 16px 22px;background:var(--ust);color:var(--ust-yazi)}
header .logo img{max-width:120px;max-height:96px;border-radius:14px;object-fit:contain}
header h1{font-family:"Playfair Display",Georgia,"Times New Roman",serif;margin:10px 0 4px;font-size:30px;letter-spacing:.5px}
header p{margin:0;font-size:12px;letter-spacing:5px;text-transform:uppercase;opacity:.75}
header p:before,header p:after{content:"";display:inline-block;width:26px;height:1px;background:currentColor;
vertical-align:middle;margin:0 10px;opacity:.6}
nav{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:12px 10px;
border-bottom:1px solid var(--cizgi);box-shadow:0 6px 12px -10px #0006}
nav a{white-space:nowrap;color:var(--yazi);text-decoration:none;padding:7px 15px;border-radius:20px;
border:1px solid var(--cizgi);background:var(--sekme);font-size:14px}
nav a:active{background:var(--vurgu);color:#fff;border-color:var(--vurgu)}
main{max-width:640px;margin:0 auto;padding:6px 18px 40px}
h2{font-family:"Playfair Display",Georgia,"Times New Roman",serif;color:var(--vurgu);font-size:22px;
text-align:center;margin:30px 0 10px;scroll-margin-top:70px}
h2:after{content:"";display:block;width:46px;height:2px;background:var(--vurgu);margin:8px auto 0;opacity:.7}
.u{padding:12px 2px;border-bottom:1px dashed var(--cizgi)}
.u .ust{display:flex;align-items:baseline;gap:8px}
.u .ad{font-weight:700;font-size:16px}
.u .nokta{flex:1;border-bottom:2px dotted var(--cizgi);transform:translateY(-4px)}
.u .f{color:var(--fiyat);font-weight:700;white-space:nowrap;font-size:16px}
.u .ac{color:var(--soluk);font-size:13px;margin-top:4px;font-style:italic}
footer{text-align:center;color:var(--soluk);font-size:13px;padding:30px 16px 36px;letter-spacing:1px}
footer .imza{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:18px}
footer .imza svg{width:52px;height:52px}
footer .imza span{font-size:16px;font-weight:700;letter-spacing:2px;color:var(--yazi)}
</style></head><body><header><h1>DENEME</h1><p>Menü</p></header>
<nav></nav><main><p>Menü hazırlanıyor.</p></main>

</svg>
<span>SYRONIQ Technologies</span></span></footer></body></html>
